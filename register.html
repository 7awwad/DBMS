<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Car Rental System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }

        .register-header {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .register-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .register-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .register-form {
            padding: 40px 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #27ae60;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .register-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #27ae60;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message {
            background: #27ae60;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .validation-message {
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        .validation-message.error {
            color: #e74c3c;
        }

        .validation-message.success {
            color: #27ae60;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .register-container {
                margin: 10px;
            }
            
            .register-header {
                padding: 20px;
            }
            
            .register-form {
                padding: 30px 20px;
            }
        }
    </style>
</head>v 
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>🚗 Join Car Rental</h1>
            <p>Create your account to get started</p>
        </div>
        
        <div class="register-form">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required>
                        <div id="usernameValidation" class="validation-message"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                        <div id="emailValidation" class="validation-message"></div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required>
                        <div class="password-requirements">
                            At least 6 characters long
                        </div>
                        <div id="passwordValidation" class="validation-message"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                        <div id="confirmPasswordValidation" class="validation-message"></div>
                    </div>
                </div>
                
                <button type="submit" class="register-btn" id="registerBtn">
                    Create Account
                </button>
            </form>
            
            <div class="login-link">
                <p>Already have an account? <a href="/login">Sign in here</a></p>
            </div>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Validation elements
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        const usernameValidation = document.getElementById('usernameValidation');
        const emailValidation = document.getElementById('emailValidation');
        const passwordValidation = document.getElementById('passwordValidation');
        const confirmPasswordValidation = document.getElementById('confirmPasswordValidation');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function showValidation(element, message, isError = true) {
            element.textContent = message;
            element.className = `validation-message ${isError ? 'error' : 'success'}`;
            element.style.display = 'block';
        }

        function hideValidation(element) {
            element.style.display = 'none';
        }

        // Real-time validation
        usernameInput.addEventListener('input', (e) => {
            const username = e.target.value;
            if (username.length < 3) {
                showValidation(usernameValidation, 'Username must be at least 3 characters');
            } else if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showValidation(usernameValidation, 'Username can only contain letters, numbers, and underscores');
            } else {
                showValidation(usernameValidation, 'Username looks good!', false);
            }
        });

        emailInput.addEventListener('input', (e) => {
            const email = e.target.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email && !emailRegex.test(email)) {
                showValidation(emailValidation, 'Please enter a valid email address');
            } else if (email) {
                showValidation(emailValidation, 'Email looks good!', false);
            } else {
                hideValidation(emailValidation);
            }
        });

        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            if (password.length < 6) {
                showValidation(passwordValidation, 'Password must be at least 6 characters');
            } else {
                showValidation(passwordValidation, 'Password strength: Good', false);
            }
            
            // Also check confirm password if it has a value
            if (confirmPasswordInput.value) {
                validateConfirmPassword();
            }
        });

        function validateConfirmPassword() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (confirmPassword && password !== confirmPassword) {
                showValidation(confirmPasswordValidation, 'Passwords do not match');
                return false;
            } else if (confirmPassword) {
                showValidation(confirmPasswordValidation, 'Passwords match!', false);
                return true;
            }
            return true;
        }

        confirmPasswordInput.addEventListener('input', validateConfirmPassword);

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            
            const formData = {
                username: usernameInput.value,
                email: emailInput.value,
                full_name: document.getElementById('fullName').value,
                password: passwordInput.value
            };
            
            const confirmPassword = confirmPasswordInput.value;
            
            // Client-side validation
            if (!formData.username || !formData.email || !formData.full_name || !formData.password || !confirmPassword) {
                showError('Please fill in all required fields');
                return;
            }
            
            if (formData.password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (formData.password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating Account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Account created successfully! Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    showError(data.error || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError('Network error. Please try again.');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });

        // Check if user is already logged in
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/auth/status', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.authenticated) {
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.log('Not logged in');
            }
        });
    </script>
</body>
</html>
